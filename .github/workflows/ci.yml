name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Build, lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    name: Integration (real vitest run) — vitest ${{ matrix.vitest }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # Validates the `peerDependencies["vitest"]` range (">=3.0.0")
        # empirically rather than by assertion. The range is open-ended, so this
        # matrix can only ever prove the versions that existed when it was last
        # touched — add a leg when Vitest ships a notable minor; the range
        # itself needs no edit.
        #
        # The three legs are chosen to pin the boundaries the code actually
        # branches on, not just "old, middle, new":
        #
        #   3.0.x — the declared floor. This is the leg that proves the
        #           feature detection works: `TestCase.annotations()` does NOT
        #           exist here, so an unguarded call would throw and this leg
        #           would fail. Playwright's sibling package shipped a 1.40
        #           floor while using an API added in 1.42; this matrix exists
        #           so that cannot happen here silently.
        #   3.2.x — the first version WITH annotations(), proving the other
        #           side of that branch.
        #   4.x   — current.
        #
        # Node varies with the leg: Vitest 4 requires Node 20+.
        #
        # `types` is pinned per leg because Vitest 4 declares a peerOptional on
        # @types/node ">=20", while this package's own devDependency is ^18 to
        # match its `engines: node >=18`. Installing 4.x over the ^18 types is
        # an ERESOLVE failure — and npm reports it as an arborist crash
        # ("Cannot read properties of null (reading 'edgesOut')"), which says
        # nothing about the real conflict. The reporter itself is fine on
        # Vitest 4; only the type dependency needed moving.
        include:
          - vitest: '3.0.9'
            node: '20'
            types: '^18.19.50'
          - vitest: '3.2.7'
            node: '20'
            types: '^18.19.50'
          - vitest: '4.1.10'
            node: '22'
            types: '^22.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install with matrix Vitest version
        # package.json is edited with node rather than `npm pkg set`, because
        # the runner's npm and a local npm disagreed about this step twice and
        # each failure surfaced only as an arborist crash ("Cannot read
        # properties of null (reading 'edgesOut')") that named neither the
        # package nor the conflict. A JSON edit does the same job with no npm
        # behaviour in the way.
        #
        # The lockfile is removed because these legs deliberately install a tree
        # it does not describe — Vitest 4 pulls a different Vite major.
        #
        # @types/node is pinned per leg: Vitest 4 declares a peerOptional on
        # ">=20", while this package pins ^18 to match `engines: node >=18`.
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.devDependencies.vitest = "${{ matrix.vitest }}";
            pkg.devDependencies["@types/node"] = "${{ matrix.types }}";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          rm -f package-lock.json
          echo "--- npm $(npm --version), node $(node --version) ---"
          echo "--- devDependencies npm will resolve ---"
          node -p "JSON.stringify(require('./package.json').devDependencies, null, 2)"
          npm install --no-audit --no-fund --loglevel=error
      - run: npm run build
      - name: Confirm the matrix version is the one actually installed
        # Cheap, and it catches a resolution that quietly ignored the pin —
        # otherwise three green legs could all be testing the same version.
        run: |
          INSTALLED="$(node -p "require('vitest/package.json').version")"
          echo "installed vitest: $INSTALLED (matrix asked for ${{ matrix.vitest }})"
          case "$INSTALLED" in
            ${{ matrix.vitest }}*) ;;
            *) echo "::error::vitest $INSTALLED installed, expected ${{ matrix.vitest }}"; exit 1 ;;
          esac
      - run: npm run test:integration

  example:
    name: Example project (packaged tarball)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and install into examples/basic
        # Installs the PACKED TARBALL, not the working tree, so a broken
        # `files` or `exports` map fails here instead of after publishing.
        # Every local check passes happily with a package that cannot be
        # consumed once installed by name.
        run: |
          TARBALL="$(npm pack --silent | tail -1)"
          cd examples/basic
          npm install --no-audit --no-fund "../../$TARBALL"
      - name: Run the example as its README documents
        working-directory: examples/basic
        run: npm test
      - name: Assert it produced a usable report
        working-directory: examples/basic
        run: |
          node -e '
            const fs = require("node:fs");
            const dir = "qualflare-results";
            const files = fs.readdirSync(dir).filter((f) => f.endsWith(".json"));
            if (files.length !== 1) throw new Error(`expected 1 report, got ${files.length}`);
            const report = JSON.parse(fs.readFileSync(`${dir}/${files[0]}`, "utf8"));
            if (!report.metadata) throw new Error("missing metadata — the CLI keys format detection on it");
            if ("config" in report) throw new Error("top-level config key — that is the Playwright-JSON signature");
            if (report.framework !== "vitest") throw new Error(`framework=${report.framework}, expected vitest`);
            const cases = report.suites.flatMap((s) => s.cases);
            if (cases.length === 0) throw new Error("report contains no cases");
            console.log(`ok: ${report.suites.length} suite(s), ${cases.length} case(s)`);
          '

  no-network:
    name: Reporter makes no network calls
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Grep the BUILT bundle for any HTTP client
        # Asserted against the shipped bundle rather than a mock server, on
        # purpose: a sibling repo's mock once implemented an endpoint the real
        # API never served, which hid a broken upload for two releases. A mock
        # can lie about the network; the absence of a client cannot.
        run: |
          if grep -rnE "fetch\(|axios|node-fetch|require\(['\"](http|https|node:http)|from ['\"](http|https|node:http)" \
               dist --include='*.js' --include='*.cjs'; then
            echo "::error::an HTTP client reached the shipped bundle"
            exit 1
          fi
          echo "ok: no HTTP client in dist"
